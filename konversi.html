<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pindah data Kasirku ke Kasir Ultimate</title>
<style>
body{margin:0;background:#0f1412;color:#eef5f1;font:15px/1.5 system-ui,sans-serif;padding:16px}
.w{max-width:560px;margin:auto}h1{font-size:19px;margin:0 0 8px}
.m{color:#94a39b;font-size:13px}.c{background:#171e1b;border:1px solid #29352f;border-radius:14px;padding:12px;margin:10px 0}
button{border:0;border-radius:11px;padding:11px 14px;background:#27c99b;color:#07110d;font-weight:700;margin:4px 6px 4px 0}
button.s{background:#173c32;color:#27c99b}button:disabled{opacity:.4}
input[type=file]{width:100%;padding:10px;background:#111714;border:1px solid #29352f;border-radius:10px;color:#eef5f1}
.r{display:flex;justify-content:space-between;border-bottom:1px solid #29352f;padding:5px 0}.bad{color:#ff6b61}.ok{color:#27c99b}
</style></head><body><div class="w">
<h1>Pindah data Kasirku ke Kasir Ultimate</h1>
<p class="m">Alamat halaman ini: <b id="org"></b><br>Harus sama dengan alamat aplikasi Kasir: <b>https://dedensetiawan241196-maker.github.io</b></p>
<div class="c"><b>1.</b> Tutup aplikasi Kasir Ultimate sepenuhnya (geser dari daftar aplikasi terbuka).<br><b>2.</b> Pilih file backup Kasirku (.json atau .txt):<br><input id="f" type="file" accept=".json,.txt,application/json,text/plain"></div>
<div id="out"></div>
<div><button id="save" disabled>Simpan ke Kasir Ultimate</button><button id="dl" class="s" disabled>Unduh hasil (.json)</button></div>
<div id="msg" class="c m" style="display:none"></div>
<script>
const KEY='kasir_ultimate_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const rp=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID');
const $=s=>document.querySelector(s);
function normalize(o){o=o&&typeof o==='object'?o:{};return {products:Array.isArray(o.products)?o.products.map(p=>({...p,id:String(p.id||uid()),name:String(p.name||'').trim(),buy:+p.buy||0,sell:+p.sell||0,stock:Math.max(0,+p.stock||0),min:Math.max(0,+p.min||0),category:String(p.category||'Umum'),barcode:String(p.barcode||''),unit:String(p.unit||'pcs'),supplier:String(p.supplier||''),img:typeof p.img==='string'?p.img:''})).filter(p=>p.name):[],sales:Array.isArray(o.sales)?o.sales:[],pays:Array.isArray(o.pays)?o.pays:[],moves:Array.isArray(o.moves)?o.moves:[],kas:Array.isArray(o.kas)?o.kas:[],shop:String(o.shop||'Warung Saya'),lang:o.lang==='en'?'en':'id',pin:String(o.pin||'1234'),settings:{dark:o.settings?.dark!==false,lockMinutes:Math.max(0,+o.settings?.lockMinutes||0)},created:+o.created||now()}}
function fromKasirku(o){let legacy=o.products.some(p=>p.cat!==undefined||p.bc!==undefined||p.sup!==undefined)||o.sales.some(x=>x.method==='kasbon'||x.discount===undefined);if(!legacy)return o;let pays=Array.isArray(o.pays)?o.pays.slice():[];let products=o.products.map(p=>{let {cat,bc,sup,...r}=p;return {...r,category:p.category||cat||'Umum',barcode:p.barcode||bc||'',supplier:p.supplier||sup||'',unit:p.unit||'pcs'}});let sales=o.sales.map(x=>{let credit=x.method==='kasbon'||x.method==='credit';let items=(x.items||[]).map(i=>({...i,barcode:i.barcode||'',unit:i.unit||'pcs'}));let sub=x.subtotal??items.reduce((a,i)=>a+i.q*i.sell,0);let total=+x.total||0;if(credit&&x.method==='kasbon'){let paidPart=Math.max(0,total-(+x.debt||0));if(paidPart>0)pays.push({id:uid(),t:x.t,buyer:x.buyer,amt:paidPart})}let {disc,...r}=x;return {...r,items,subtotal:sub,discount:x.discount??disc??0,method:credit?'credit':'cash',paid:credit?0:total,given:credit?0:(+x.given||total),change:credit?0:(+x.change||0),debt:credit?total:0,cancelled:!!x.cancelled,returned:Array.isArray(x.returned)?x.returned:[]}}).sort((a,b)=>b.t-a.t);let tmap={jual:'sale',masuk:'in',adj:'adj'};let moves=(Array.isArray(o.moves)?o.moves:[]).map(m=>m.ref!==undefined?m:{id:m.id,t:m.t,type:tmap[m.type]||m.type,ref:m.pid,q:m.q,note:m.note||''}).sort((a,b)=>b.t-a.t);return {...o,products,sales,pays,moves}}
function debtors(db){let m={};db.sales.filter(s=>s.method==='credit'&&!s.cancelled).forEach(s=>{let k=String(s.buyer||'').trim().toLowerCase();if(!k)return;m[k]=m[k]||{n:s.buyer,d:0};m[k].d+=(+s.debt||0)});db.pays.forEach(p=>{let k=String(p.buyer||'').trim().toLowerCase();if(m[k])m[k].d-=(+p.amt||0)});return Object.values(m).map(x=>({n:x.n,d:Math.max(0,x.d)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d)}
function summarize(db){let ds=debtors(db);return {produk:db.products.length,foto:db.products.filter(p=>p.img).length,transaksi:db.sales.length,piutang:ds.reduce((a,x)=>a+x.d,0),ds}}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let result=null;
function say(t,bad){let m=$('#msg');m.style.display='block';m.className='c '+(bad?'bad':'ok');m.textContent=t}
if(typeof document!=='undefined'&&document.querySelector('#org')){
$('#org').textContent=location.origin;
$('#f').onchange=function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.products)||!Array.isArray(o.sales))throw new Error('x');result=normalize(fromKasirku(o));let s=summarize(result),old=null;try{old=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
let warn=old&&((old.products||[]).length||(old.sales||[]).length)?'<p class="bad"><b>Perhatian:</b> Kasir Ultimate di HP ini sudah berisi '+(old.products||[]).length+' produk dan '+(old.sales||[]).length+' transaksi. Menyimpan akan MENIMPA data itu.</p>':'';
$('#out').innerHTML='<div class="c"><b>Hasil pembacaan</b><br>Nama warung: '+esc(result.shop)+'<div class="r"><span>Produk</span><b>'+s.produk+' ('+s.foto+' dengan foto)</b></div><div class="r"><span>Transaksi</span><b>'+s.transaksi+'</b></div><div class="r"><span>Total piutang kasbon</span><b>'+rp(s.piutang)+'</b></div>'+s.ds.map(x=>'<div class="r"><span>'+esc(x.n)+'</span><span>'+rp(x.d)+'</span></div>').join('')+warn+'</div>';
$('#save').disabled=false;$('#dl').disabled=false;$('#msg').style.display='none'}catch(e){result=null;$('#out').innerHTML='';$('#save').disabled=true;$('#dl').disabled=true;say('File tidak bisa dibaca sebagai backup Kasirku.',true)}};r.readAsText(f)};
$('#save').onclick=()=>{if(!result)return;try{localStorage.setItem(KEY,JSON.stringify(result));say('Tersimpan. Buka Kasir Ultimate dari ikonnya. PIN awal: 1234.')}catch(e){say('Gagal menyimpan (penyimpanan penuh atau diblokir). Pakai tombol Unduh lalu Restore di aplikasi.',true)}};
$('#dl').onclick=()=>{if(!result)return;let b=new Blob([JSON.stringify(result)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Kasir_Ultimate_dari_Kasirku.json';a.click()};
}
</script></div></body></html>
